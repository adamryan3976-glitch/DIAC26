    <!--
      Tell every browser (and, most importantly, iOS's standalone Home
      Screen app WebView, which caches far more aggressively than a normal
      browser tab) not to cache this page at all. This is defense-in-depth
      alongside the version-check script below — GitHub Pages doesn't allow
      setting real Cache-Control response headers, so this is the strongest
      lever available from inside the page itself.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!--
      Registers a minimal service worker purely so iOS treats this as a real
      "installed" Home Screen app rather than a bare bookmark — that's what
      protects its sign-in session from Safari's aggressive local-storage
      clearing when staff close the app. See sw.js for details; it doesn't
      cache anything or affect how the app works.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>

    <!--
      Self-updating check. This is the real fix for stale data on phones
      (especially iPhone Home Screen icons, which iOS caches far more
      stubbornly than a normal browser tab and gives no way to manually
      force-refresh): APP_VERSION below must be updated to match version.json
      every time this file is redeployed. On load, and every few minutes
      after that while the app stays open, it fetches version.json with
      cache disabled at the request level (so this one check always reaches
      the real server, no matter how aggressively the page itself is
      cached) and compares it to what's actually running. A mismatch means
      a newer version has been deployed since this copy loaded, so it
      forces a real reload — via a cache-busting URL, not a plain reload,
      so it can't just re-serve the same stale cached page — pulling the
      current version and its current data automatically. This is what
      keeps duty/attendance/schedule data from silently going stale on
      someone's phone for days without them ever deleting and reinstalling
      the Home Screen icon.
    -->
    <script>
      var APP_VERSION = "2026-09-30T14:41:33Z";

      function checkForUpdate() {
        fetch('version.json', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.version && data.version !== APP_VERSION) {
              var url = location.pathname + '?v=' + encodeURIComponent(data.version);
              window.location.replace(url);
            }
          })
          .catch(function () { /* offline or blocked — just keep using what's loaded */ });
      }

      checkForUpdate();
      setInterval(checkForUpdate, 3 * 60 * 1000); // re-check every 3 minutes while open
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') checkForUpdate();
      });
    </script>

        function normalizeStaffKey(text) {
            return String(text || '').replace(/[\s.]/g, '').toLowerCase();
        }

        function getDayKeyForDate(d) {
            return d.toLocaleDateString('en-US', { weekday: 'long' }) + ' ' + d.getDate();

        // Checks whether a duty entry's "who" list refers to this staff member.
        // Matches on the normalized full name or abbreviation first; falls back to
        // a first-initial + last-name match so small formatting differences in the
        // Supervision sheet (extra space, missing period, etc.) don't hide a match.
        function staffMatchesWho(person, whoList) {
            const whoNormalized = (whoList || []).map(normalizeStaffKey);
            const fullKey = normalizeStaffKey(person.name);
            const abbrevKey = normalizeStaffKey(person.abbrev);
            if (whoNormalized.includes(fullKey) || whoNormalized.includes(abbrevKey)) return true;
            const parts = person.name.trim().split(/\s+/);
            if (parts.length >= 2) {
                const firstInitial = parts[0][0].toLowerCase();
                const lastName = normalizeStaffKey(parts.slice(1).join(' '));
                return whoNormalized.some(w => lastName && w.endsWith(lastName) && w.startsWith(firstInitial));
            }
            return false;
        }

        // Best-effort parse of a duty time range like "4:15 - 5:00" into
        // minutes-since-midnight. Uses an explicit AM/PM word in the duty's own
        // label if present (e.g. "PM 1 free time"), otherwise falls back to
        // assuming 1-6 o'clock means PM (typical for an afternoon/evening camp
        // duty block) since the sheet's time text alone doesn't carry AM/PM.
        function parseDutyTimeRange(timeText, dutyText) {
            const matches = [...String(timeText || '').matchAll(/(\d{1,2}):(\d{2})/g)];
            if (matches.length < 2) return null;
            const marker = /\bpm\b/i.test(dutyText) ? 'PM' : (/\bam\b/i.test(dutyText) ? 'AM' : null);
            const toMinutes = (h, m) => {
                h = parseInt(h, 10);
                if (marker === 'PM' && h < 12) h += 12;
                else if (marker === 'AM' && h === 12) h = 0;
                else if (!marker && h >= 1 && h <= 6) h += 12;
                return h * 60 + parseInt(m, 10);
            };
            return { start: toMinutes(matches[0][1], matches[0][2]), end: toMinutes(matches[1][1], matches[1][2]) };
        }

        // Period time windows, used to default the Attendance tab to whatever
        // session is currently running. Expressed in minutes-since-midnight,
        // local device time (staff phones are expected to be on camp-local time).
        const PERIOD_TIMES = [
            { session: '1', start: 9 * 60 + 0, end: 10 * 60 + 15 },   // 9:00 - 10:15
            { session: '2', start: 10 * 60 + 30, end: 11 * 60 + 45 }, // 10:30 - 11:45
            { session: '3', start: 13 * 60 + 30, end: 14 * 60 + 45 }, // 1:30 - 2:45 PM

        ];

        // Returns the session currently running, or — between/outside periods
        // — the next one coming up today, or the last one if the day's
        // periods are already over.
        function getCurrentPeriod(now) {
            const d = now || new Date();
            const minutes = d.getHours() * 60 + d.getMinutes();
            for (const p of PERIOD_TIMES) {
                if (minutes >= p.start && minutes < p.end) return p.session;
            }
            for (const p of PERIOD_TIMES) {
                if (minutes < p.start) return p.session;
            }
            return PERIOD_TIMES[PERIOD_TIMES.length - 1].session;
        }

            const s = String(url).trim();
            if (s.includes('drive.google.com')) {
                let id = "";
                if (s.includes('id=')) { id = s.split('id=')[1].split('&')[0]; }
                else if (s.includes('/file/d/')) { id = s.split('/file/d/')[1].split('/')[0]; }

                return `https://lh3.googleusercontent.com/d/${s}=s400`;

            useEffect(() => {

            const logout = () => {
                localStorage.removeItem('diac_user');

                window.location.reload();
            };

            // Initialize the Google OAuth client using a full-page redirect
            // rather than a popup. Google's own guidance is to avoid the popup
            // UX mode on mobile: many mobile browsers don't cleanly block a
            // JS-opened popup — instead they silently steer it into an
            // already-open background tab, showing whatever was last loaded
            // there instead of Google's sign-in page. A redirect never opens
            // a second window, so it can't be hijacked that way. Because the
            // page fully reloads after the redirect back, the same callback
            // must be (and is) re-registered on every mount — which this
            // effect already does.
            useEffect(() => {
                if (isAuthenticated) return;
                let cancelled = false;

                const initGis = () => {
                    if (cancelled) return;
                    if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
                        const client = google.accounts.oauth2.initTokenClient({
                            client_id: GOOGLE_CLIENT_ID,
                            scope: 'https://www.googleapis.com/auth/userinfo.email',
                            ux_mode: 'redirect',
                            redirect_uri: window.location.origin + window.location.pathname,
                            callback: handleGoogleSsoCallback
                        });
                        setTokenClient(client);
                    } else {
                        setTimeout(initGis, 300);
                    }
                };
                initGis();

                return () => { cancelled = true; };
            }, [isAuthenticated]);

            const handleGoogleSsoCallback = async (response) => {
                // The redirect flow returns the token in the URL fragment;
                // clear it immediately so it's never left sitting around in
                // browser history.
                if (window.location.hash) {
                    window.history.replaceState({}, document.title, window.location.pathname + window.location.search);

                if (!response || response.error) {
                    setIsLoggingIn(false);
                    if (response && response.error !== 'popup_closed' && response.error !== 'popup_closed_by_user') {
                        setAuthError('Google sign-in failed. Please try again.');
                    }
                    return;
                }
                setIsLoggingIn(true);
                setAuthError('');
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=login&token=${encodeURIComponent(response.access_token)}`);
                    const data = await res.json();

                    if (data.success) {
                        localStorage.setItem('diac_user', data.email);
                        localStorage.setItem('diac_hoc', String(data.isHoc));
                        localStorage.setItem('diac_session', data.session);
                        setIsAuthenticated(true);
                        setCurrentUser(data.email);
                        setIsHoc(data.isHoc);
                        setSessionToken(data.session);
                        fetchData(data.session);
                    } else {
                        setAuthError(data.error || "Login Failed");
                    }
                } catch (e) {
                    setAuthError("Connection Error");
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleSignInClick = () => {
                if (!tokenClient) return;
                setAuthError('');
                setIsLoggingIn(true);
                tokenClient.requestAccessToken({ prompt: '' });
            };

            const fetchData = async (tokenOverride) => {
                const token = tokenOverride || sessionToken;
                if (!token) return;
                setRefreshing(true);
                setFetchError('');
                try {
                    const endpoints = ['students', 'schedule', 'absences', 'classes', 'attStudents', 'massageSchedule', 'duty', 'housing', 'staffFinder', 'cabins', 'emergency', 'venues', 'campFire'];
                    const results = await Promise.all(
                        endpoints.map(ep =>
                            fetch(`${SCRIPT_URL}?action=${ep}&session=${encodeURIComponent(token)}`)
                                .then(r => r.json())
                                .catch(() => ({ error: 'network' }))
                        )
                    );

                    if (results.some(r => r && typeof r.error === 'string' && r.error.startsWith('Unauthorized'))) {
                        setFetchError('Your session expired. Please sign in again.');
                        logout();
                        return;
                    }

                    const failedEndpoints = endpoints.filter((ep, i) => !results[i] || results[i].error);
                    const failed = failedEndpoints.length > 0;
                    if (failed) {
                        setFetchError(`Could not refresh: ${failedEndpoints.join(', ')}. Showing the last version loaded — check your connection and try again.`);
                    }

                    if (results[0] && !results[0].error) setStudents(results[0]);
                    if (results[1] && !results[1].error) setSchedule(results[1]);
                    if (results[2] && !results[2].error) {
                        setAbsences(results[2]);
                        const initialLocal = {};
                        const today = new Date().toDateString();

                            if (absDate === today) {
                                initialLocal[`${abs.studentName}-${abs.session}-${abs.activity}`] = abs.status;
                            }
                        });
                        setLocalAttendance(prev => ({...prev, ...initialLocal}));
                    }
                    if (results[3] && !results[3].error) setClasses(results[3]);
                    if (results[4] && !results[4].error) setAttStudents(results[4]);
                    if (results[5] && !results[5].error) setMassageSchedule(results[5]);
                    if (results[6] && !results[6].error) setDutyRoster(results[6]);
                    if (results[7] && !results[7].error) setStaffHousing(results[7]);
                    if (results[8] && !results[8].error) {
                        setStaffRoster(Array.isArray(results[8].roster) ? results[8].roster : []);
                        setStaffClassSchedule(results[8].classSchedule || {});
                    }
                    if (results[9] && !results[9].error) setCabins(results[9]);
                    if (results[10] && !results[10].error) setEmergencyData(results[10]);
                    if (results[11] && !results[11].error) setVenuesData(results[11]);
                    if (results[12] && !results[12].error) setCampFire(results[12]);

                    if (!failed) {
                        setLastUpdated(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                    }
                } catch (e) {
                    setFetchError('Could not refresh data — showing the last version loaded. Check your connection and try again.');
                }
                finally { setLoading(false); setRefreshing(false); setHocSyncingId(null); }
            };

            // Photos tab: loads the roster for whichever period+class is
            // selected. Separate from the main fetchData batch since it
            // needs params and only the Photos tab ever calls it.
            const fetchPhotoRoster = async (period, className) => {
                if (!className) { setPhotoRoster([]); return; }
                setPhotoRosterLoading(true);
                setPhotoRosterError('');
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=classRoster&period=${encodeURIComponent(period)}&className=${encodeURIComponent(className)}&session=${encodeURIComponent(sessionToken)}`);
                    const data = await res.json();
                    if (!Array.isArray(data)) {
                        setPhotoRosterError((data && data.error) || 'Could not load that class.');
                        setPhotoRoster([]);
                        return;
                    }
                    setPhotoRoster(data);
                } catch (e) {
                    setPhotoRosterError('Could not load that class — check your connection and try again.');
                    setPhotoRoster([]);
                } finally {
                    setPhotoRosterLoading(false);
                }
            };

            useEffect(() => {
                if (activeTab === 'photos' && photoClassName) {
                    fetchPhotoRoster(photoPeriod, photoClassName);
                }
            }, [activeTab, photoPeriod, photoClassName]);

            // Resizes + compresses an image file in the browser before upload,
            // so a full-resolution phone photo doesn't crawl over camp Wi-Fi.
            // Caps the longest edge at 1280px and re-encodes as JPEG.
            const compressImageForUpload = (file) => new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Could not read photo.'));
                reader.onload = () => {
                    img.onerror = () => reject(new Error('Could not read photo.'));
                    img.onload = () => {
                        const maxEdge = 1280;
                        let { width, height } = img;
                        if (width > maxEdge || height > maxEdge) {
                            if (width >= height) { height = Math.round(height * (maxEdge / width)); width = maxEdge; }
                            else { width = Math.round(width * (maxEdge / height)); height = maxEdge; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                        resolve(dataUrl.split(',')[1]); // strip the "data:image/jpeg;base64," prefix
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });

            const openPhotoPicker = (student) => {
                photoUploadTargetRef.current = student;
                setPhotoUploadError('');
                if (photoFileInputRef.current) photoFileInputRef.current.click();
            };

            const handlePhotoFileSelected = async (e) => {
                const file = e.target.files && e.target.files[0];
                const student = photoUploadTargetRef.current;
                e.target.value = ''; // allow re-selecting the same file later
                if (!file || !student) return;

                setPhotoUploadingKey(student.stuNum);
                setPhotoUploadError('');
                try {
                    const photoBase64 = await compressImageForUpload(file);
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            action: 'uploadPhoto',
                            session: sessionToken,
                            period: photoPeriod,
                            className: photoClassName,
                            stuNum: student.stuNum,
                            firstName: student.firstName,
                            lastName: student.lastName,
                            grade: student.grade,
                            mimeType: 'image/jpeg',
                            photoBase64: photoBase64
                        })
                    });
                    const data = await res.json();
                    if (!data || data.success !== true) {
                        setPhotoUploadError((data && data.error) || 'Could not upload photo. Please try again.');
                        return;
                    }
                    setPhotoUploadedKeys(prev => ({ ...prev, [student.stuNum]: (prev[student.stuNum] || 0) + 1 }));
                } catch (e) {
                    setPhotoUploadError('Could not upload photo — check your connection and try again.');
                } finally {
                    setPhotoUploadingKey(null);
                }
            };

            // Re-sync the Attendance tab to whichever period is running right
            // now each time staff open that tab — but only while they haven't
            // manually picked a different session, so it never fights a
            // deliberate choice.
            useEffect(() => {
                if (activeTab === 'attendance' && attSessionAuto) {
                    setAttSession(getCurrentPeriod());
                }
            }, [activeTab]);

            // Auto-refresh while an HOC is viewing the HOC tab, so if two HOCs
            // are both out looking for the same student, whichever one finds
            // them first shows up for the other within a few seconds instead
            // of requiring a manual pull-to-refresh.
            useEffect(() => {
                if (!isAuthenticated || !isHoc || activeTab !== 'hoc') return;
                const interval = setInterval(() => { fetchData(); }, 20000);
                return () => clearInterval(interval);
            }, [isAuthenticated, isHoc, activeTab, sessionToken]);

            const stageStatusChange = (studentName, newStatus) => {
                const key = `${studentName}-${attSession}-${attActivity}`;
                setLocalAttendance(prev => ({ ...prev, [key]: newStatus }));
            };

            // Every enrolled student defaults to "Present" until the teacher
            // flags an exception — this both matches how attendance is
            // normally taken (call out exceptions, not every present kid)
            // and, critically, means SUBMIT always records the full class
            // roster (not just the students someone tapped). That full-roster
            // record on every submission is what lets the HOC tab tell "this
            // class hasn't done attendance at all" apart from "this class did
            // attendance and everyone was present" — both used to look
            // identical (zero rows) before this change.
            const DEFAULT_STATUS = 'Present';

            const handleNoteChange = (id, text) => {
                setHocNotes(prev => ({ ...prev, [id]: text }));
            };

            const handleHocUpdate = async (studentName, currentAbsence, newStatus, noteText) => {
                setHocSyncingId(currentAbsence.id);
                setFetchError('');
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            action: 'updateAbsence',
                            session: sessionToken,
                            id: currentAbsence.id,
                            status: newStatus,
                            note: noteText || ''
                        })
                    });
                    const data = await res.json();
                    if (!data || data.success !== true) {
                        setFetchError((data && data.error) || 'Could not save that update. Please try again.');
                        setHocSyncingId(null);
                        return;
                    }
                    const key = `${studentName}-${currentAbsence.session}-${currentAbsence.activity}`;
                    setLocalAttendance(prev => ({...prev, [key]: newStatus}));
                    await fetchData();
                } catch (e) {
                    setFetchError('Could not save that update — check your connection and try again.');
                    setHocSyncingId(null);
                }
            };

            const handleSubmitAttendance = async () => {
                setIsSubmitting(true);
                setSubmitError('');
                const updates = [];
                const today = new Date().toDateString();
                
                enrolledInCurrent.forEach(s => {
                    const name = s.displayName;
                    const key = `${name}-${attSession}-${attActivity}`;
                    const status = localAttendance[key] || DEFAULT_STATUS;

                    const existing = absences.find(a => {
                        const absDate = new Date(a.timestamp).toDateString();
                        return a.studentName === name &&
                               String(a.session) === String(attSession) &&
                               a.activity === attActivity &&
                               absDate === today;
                    });

                    // Only include a student when there's no record for them
                    // yet (first-time submission for the class — this is what
                    // establishes "this class has done attendance" even when
                    // everyone's present) or their status has actually
                    // changed since what we last saw from the server. An
                    // untouched student is never resent, so a teacher fixing
                    // one student's status later can't accidentally overwrite
                    // an HOC's update to a different student with stale data.
                    if (!existing || existing.status !== status) {
                        const studentData = students.find(st => st.preferredName === name);
                        updates.push({
                            id: existing ? existing.id : null,
                            studentId: studentData ? studentData.stuNum : '000',
                            studentName: name,
                            cabin: studentData ? studentData.cabin : 'Unknown',
                            session: attSession,
                            activity: attActivity,
                            status: status,
                            reportedBy: currentUser
                        });
                    }
                });

                if (updates.length === 0) {
                    setIsSubmitting(false);
                    return;
                }

                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            action: 'bulkReport',
                            session: sessionToken,
                            data: JSON.stringify(updates)
                        })
                    });
                    const data = await res.json();
                    if (!data || data.success !== true) {
                        setSubmitError((data && data.error) || 'Could not save attendance. Please try again.');
                        setIsSubmitting(false);
                        return;
                    }
                    await fetchData();
                } catch (e) {
                    setSubmitError('Could not save attendance — check your connection and try again.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const sortedArtists = useMemo(() => {
                if (!Array.isArray(students)) return [];
                return [...students].sort((a, b) => {
                    const lastA = String(a.lastName || "").toLowerCase();
                    const lastB = String(b.lastName || "").toLowerCase();
                    if (lastA !== lastB) return lastA.localeCompare(lastB);
                    return String(a.firstName || "").toLowerCase().localeCompare(String(b.firstName || "").toLowerCase());
                });
            }, [students]);

            const filteredStudents = useMemo(() => {
                const query = searchQuery.toLowerCase().trim();
                return sortedArtists.filter(s =>
                    String(s.preferredName || "").toLowerCase().includes(query) ||
                    String(s.firstName || "").toLowerCase().includes(query) ||
                    String(s.lastName || "").toLowerCase().includes(query)
                );
            }, [sortedArtists, searchQuery]);

            // Matches on the venue name itself or on anything scheduled there
            // in any period, so searching "Acrylic" surfaces every venue
            // running that class this week, not just venues named that.
            const filteredVenues = useMemo(() => {
                const query = venueSearchQuery.toLowerCase().trim();
                if (!query) return venuesData.venues;
                return venuesData.venues.filter(v =>
                    v.venue.toLowerCase().includes(query) ||
                    venuesData.periodKeys.some(pk => String(v.periods[pk] || '').toLowerCase().includes(query))
                );
            }, [venuesData, venueSearchQuery]);

            const totalPages = Math.max(1, Math.ceil(filteredStudents.length / PAGE_SIZE));
            const pagedStudents = useMemo(() => {
                const start = (currentPage - 1) * PAGE_SIZE;
                return filteredStudents.slice(start, start + PAGE_SIZE);
            }, [filteredStudents, currentPage]);

            const enrolledInCurrent = useMemo(() => {
                if (!attActivity || !Array.isArray(attStudents)) return [];
                const sessKey = `S${attSession}`;
                return attStudents.filter(s => s[sessKey] === attActivity);
            }, [attStudents, attActivity, attSession]);

            const hasUnsavedChanges = useMemo(() => {
                const today = new Date().toDateString();
                return enrolledInCurrent.some(s => {
                    const name = s.displayName;
                    const key = `${name}-${attSession}-${attActivity}`;
                    const localStatus = localAttendance[key] || DEFAULT_STATUS;
                    const serverAbsence = absences.find(a => 
                        a.studentName === name && 
                        String(a.session) === String(attSession) && 
                        a.activity === attActivity &&
                        new Date(a.timestamp).toDateString() === today
                    );
                    const serverStatus = serverAbsence ? serverAbsence.status : 'Not Completed';
                    return localStatus !== serverStatus;
                });
            }, [enrolledInCurrent, localAttendance, absences, attSession, attActivity]);

            const groupedMassage = useMemo(() => {
                if (!Array.isArray(massageSchedule)) return [];
                const groups = [];
                const byDay = {};
                massageSchedule.forEach(entry => {
                    const dayKey = entry.day || 'Unscheduled';
                    if (!byDay[dayKey]) {
                        byDay[dayKey] = { day: dayKey, entries: [] };
                        groups.push(byDay[dayKey]);
                    }
                    byDay[dayKey].entries.push(entry);
                });
                return groups;
            }, [massageSchedule]);

            const groupedDuty = useMemo(() => {
                if (!Array.isArray(dutyRoster)) return [];
                const query = dutySearchQuery.toLowerCase().trim();
                const filtered = query
                    ? dutyRoster.filter(entry => {
                        const whoText = Array.isArray(entry.who) ? entry.who.join(', ') : String(entry.who || '');
                        return whoText.toLowerCase().includes(query);
                    })
                    : dutyRoster;
                const groups = [];
                const byDay = {};
                filtered.forEach(entry => {
                    const dayKey = entry.day || 'Unscheduled';
                    if (!byDay[dayKey]) {
                        byDay[dayKey] = { day: dayKey, entries: [] };
                        groups.push(byDay[dayKey]);
                    }
                    byDay[dayKey].entries.push(entry);
                });
                return groups;
            }, [dutyRoster, dutySearchQuery]);

            const groupedHousing = useMemo(() => {
                if (!Array.isArray(staffHousing)) return [];
                const groups = [];
                const byLocation = {};
                staffHousing.forEach(entry => {
                    const locKey = entry.location || 'Unassigned';
                    if (!byLocation[locKey]) {
                        byLocation[locKey] = { location: locKey, rooms: [] };
                        groups.push(byLocation[locKey]);
                    }
                    byLocation[locKey].rooms.push(entry);
                });
                return groups;
            }, [staffHousing]);

            // Looks up a student (for the Cabins tab's "tap a name to open
            // their profile" feature) from the plain name string as it
            // appears in the "All Cabins" sheet — matches on normalized
            // preferred name or "First Last" legal name.
            const studentsByKey = useMemo(() => {
                const map = {};
                students.forEach(s => {
                    const preferredKey = normalizeStaffKey(s.preferredName);
                    const legalKey = normalizeStaffKey(`${s.firstName || ''} ${s.lastName || ''}`);
                    if (preferredKey && !map[preferredKey]) map[preferredKey] = s;
                    if (legalKey && !map[legalKey]) map[legalKey] = s;
                });
                return map;
            }, [students]);

            const findStudentByName = (name) => {
                const key = normalizeStaffKey(name);
                if (!key) return null;
                return studentsByKey[key] || null;
            };

            // Looks up a roster person (and their photo) from a plain display
            // name string as it appears in Duty/Housing (e.g. "Andy Barber" or
            // "A. Barber") — matches on normalized full name or abbreviation
            // first, then falls back to a first-initial + last-name match, the
            // same tolerant approach used elsewhere for cross-tab name matching.
            const staffByKey = useMemo(() => {
                const map = {};
                staffRoster.forEach(p => {
                    const fullKey = normalizeStaffKey(p.name);
                    const abbrevKey = normalizeStaffKey(p.abbrev);
                    if (fullKey) map[fullKey] = p;
                    if (abbrevKey) map[abbrevKey] = p;
                });
                return map;
            }, [staffRoster]);

            const findStaffByDisplayName = (name) => {
                // Strip trailing annotations like "(Nurse)" before matching.
                const cleaned = String(name || '').replace(/\s*\([^)]*\)\s*/g, ' ').trim();
                const key = normalizeStaffKey(cleaned);
                if (!key) return null;
                if (staffByKey[key]) return staffByKey[key];

                // "F. Last" / "FLast" -> match on first-initial + full last name.
                for (const p of staffRoster) {
                    const parts = p.name.trim().split(/\s+/);
                    if (parts.length < 2) continue;
                    const firstInitial = parts[0][0].toLowerCase();
                    const lastName = normalizeStaffKey(parts.slice(1).join(' '));
                    if (lastName && key.endsWith(lastName) && key.startsWith(firstInitial)) return p;
                }

                // "First L." -> match on full first name + last-initial, only
                // when exactly one roster person fits (avoids picking the
                // wrong person when several share a first name).
                const rawParts = cleaned.split(/\s+/);
                if (rawParts.length >= 2) {
                    const givenFirst = normalizeStaffKey(rawParts[0]);
                    const givenLastInitial = rawParts[rawParts.length - 1].replace(/[^a-zA-Z]/g, '').toLowerCase();
                    if (givenFirst && givenLastInitial.length === 1) {
                        const matches = staffRoster.filter(p => {
                            const parts = p.name.trim().split(/\s+/);
                            if (parts.length < 2) return false;
                            const pFirst = normalizeStaffKey(parts[0]);
                            const pLastInitial = parts[parts.length - 1][0].toLowerCase();
                            return pFirst === givenFirst && pLastInitial === givenLastInitial;
                        });
                        if (matches.length === 1) return matches[0];
                    }
                }
                return null;
            };

            // Jumps to the Find Staff tab with a given person pre-selected —
            // used by Camp Fire (and anywhere else) to link a staff name
            // straight to their profile.
            const goToStaffMember = (person) => {
                setSelectedStaffIndex(staffRoster.indexOf(person));
                setActiveTab('staffFinder');
            };

            const StaffAvatar = ({ name, size }) => {
                const person = findStaffByDisplayName(name);
                const dim = size || 28;
                return (
                    <div className="rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center overflow-hidden shrink-0" style={{ width: dim, height: dim }}>
                        {person && person.photoId
                            ? <img src={getDirectDriveUrl(person.photoId)} className="w-full h-full object-cover" />
                            : <Icon name="user" size={Math.round(dim * 0.5)} className="text-slate-200" />}
                    </div>
                );
            };

            const filteredStaffRoster = useMemo(() => {
                const sorted = [...staffRoster].sort((a, b) => a.name.localeCompare(b.name));
                const query = staffPickerQuery.toLowerCase().trim();
                if (!query) return sorted;
                return sorted.filter(p => p.name.toLowerCase().includes(query));
            }, [staffRoster, staffPickerQuery]);

            const selectedStaffPerson = selectedStaffIndex !== null ? staffRoster[selectedStaffIndex] : null;

            const whereAreTheyNow = useMemo(() => {
                if (!selectedStaffPerson) return null;
                const now = new Date();
                const nowMinutes = now.getHours() * 60 + now.getMinutes();
                const dayKey = getDayKeyForDate(now);

                const todaysDuty = (Array.isArray(dutyRoster) ? dutyRoster : [])
                    .filter(e => e.day === dayKey && staffMatchesWho(selectedStaffPerson, e.who));
                for (const entry of todaysDuty) {
                    const range = parseDutyTimeRange(entry.time, entry.duty);
                    if (range && nowMinutes >= range.start && nowMinutes <= range.end) {
                        return { type: 'duty', label: entry.duty, where: entry.where, time: entry.time };
                    }
                }

                const period = getCurrentPeriod(now);
                const sched = (staffClassSchedule[selectedStaffPerson.abbrev] || {})['S' + period];
                if (sched) return { type: 'class', label: sched.activity, where: sched.venue, session: period };
                return { type: 'free', session: period };
            }, [selectedStaffPerson, dutyRoster, staffClassSchedule]);

            const staffScheduleForDate = useMemo(() => {
                if (!selectedStaffPerson || !staffFinderDate) return null;
                const d = new Date(staffFinderDate + 'T00:00:00');
                const dayKey = getDayKeyForDate(d);
                const dutyForDay = (Array.isArray(dutyRoster) ? dutyRoster : [])
                    .filter(e => e.day === dayKey && staffMatchesWho(selectedStaffPerson, e.who));
                const classSched = staffClassSchedule[selectedStaffPerson.abbrev] || {};
                return { dayKey, duty: dutyForDay, classes: classSched };
            }, [selectedStaffPerson, staffFinderDate, dutyRoster, staffClassSchedule]);

            const DetailRow = ({ label, value, icon }) => (
                <div className="flex items-start gap-4 p-4 bg-white/70 backdrop-blur-sm rounded-2xl border border-white shadow-sm">
                    <div className="p-2 bg-indigo-50 text-indigo-600 rounded-xl shrink-0"><Icon name={icon} size={18} /></div>
                    <div>
                        <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{label}</div>
                        <div className="text-sm font-bold text-slate-900">{value || 'N/A'}</div>
                    </div>
                </div>
            );

            const Pagination = ({ pos }) => (
                <div className={`flex items-center justify-between bg-white px-4 py-3 rounded-2xl border border-slate-200 shadow-sm ${pos === 'top' ? 'mb-4' : 'mt-4'}`}>
                    <button disabled={currentPage === 1} onClick={() => {setCurrentPage(p => p - 1); window.scrollTo(0,0);}} className="p-2 disabled:opacity-20 text-indigo-600"><Icon name="chevron-left" /></button>
                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Page {currentPage} / {totalPages}</span>
                    <button disabled={currentPage >= totalPages} onClick={() => {setCurrentPage(p => p + 1); window.scrollTo(0,0);}} className="p-2 disabled:opacity-20 text-indigo-600"><Icon name="chevron-right" /></button>
                </div>
            );

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white gap-4">
                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                    <p className="whimsical-font text-slate-400 font-bold uppercase text-[10px] tracking-widest">DIAC HUB LOADING...</p>
                </div>
            );

            if (!isAuthenticated) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-transparent relative z-10">
                    <div className="w-full max-w-sm space-y-6 animate-fade-in bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-white/50">
                        <div className="text-center">
                            <img src={APP_LOGO_URL} className="w-20 mx-auto mb-4" />
                            <h1 className="text-3xl font-black text-indigo-600 whimsical-font italic uppercase text-center">DIAC HUB</h1>
                        </div>
                        <div className="space-y-4 pt-4">
                            <p className="text-xs text-slate-500 font-medium text-center">
                                Secure single sign-on access. Please use your official school board Google credentials to verify.
                            </p>
                            <div className="pt-2">
                                <button
                                    onClick={handleSignInClick}
                                    disabled={!tokenClient || isLoggingIn}
                                    className="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 hover:bg-slate-50 disabled:opacity-50 text-slate-700 font-bold text-sm py-3.5 rounded-2xl shadow-sm transition-colors"
                                >
                                    <GoogleIcon />
                                    {isLoggingIn ? 'Verifying credentials...' : 'Sign in with Google'}
                                </button>
                            </div>
                            {authError && <p className="text-rose-500 text-xs font-bold text-center px-2">{authError}</p>}
                        </div>
                    </div>
                </div>
            );

            // Filter for HOC Tab: Only show if NOT present. Sorted so
            // still-unlocated students ("Absent") surface above ones already
            // found and marked Late/Excused, so HOCs see who still needs
            // locating first.
            const HOC_STATUS_PRIORITY = { 'Absent - Unknown': 0, 'Late': 1, 'Absent - Excused': 2 };
            const activeHocAbsences = absences
                .filter(a =>
                    String(a.session) === String(hocSession) &&
                    new Date(a.timestamp).toDateString() === new Date().toDateString() &&
                    a.status !== 'Present'
                )
                .sort((a, b) => (HOC_STATUS_PRIORITY[a.status] ?? 99) - (HOC_STATUS_PRIORITY[b.status] ?? 99));

            // Classes that have submitted NO attendance records at all for
            // this session today (including all-present submissions, which
            // now always write a full-roster record — see DEFAULT_STATUS
            // above), so HOCs can chase down whichever teacher hasn't done
            // attendance yet.
            const submittedActivitiesThisSession = new Set(
                absences
                    .filter(a => String(a.session) === String(hocSession) && new Date(a.timestamp).toDateString() === new Date().toDateString())
                    .map(a => a.activity)
            );
            const missingAttendanceClasses = (classes[`S${hocSession}`] || [])
                .filter(c => !submittedActivitiesThisSession.has(c));

            // Filter for Recent Reports block
            const recentReportsList = [...absences]
                .filter(a => a.status !== 'Present')
                .reverse()
                .slice(0, 10);

                                        </div>

                                        <div className="bg-white/70 backdrop-blur-md p-6 rounded-[2rem] border border-white shadow-sm">
                                            <div className="flex items-center justify-between mb-4">
                                                <h3 className="text-sm font-black text-slate-800">Schedule</h3>
                                                <input
                                                    type="date"
                                                    className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 outline-none"
                                                    value={staffFinderDate}
                                                    onChange={e => setStaffFinderDate(e.target.value)}
                                                />
                                            </div>

                                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-3">Periods (same each day this week)</p>
                                            <div className="grid grid-cols-2 gap-2 mb-5">
                                                {['1', '2', '3', '4'].map(s => {
                                                    const sched = staffScheduleForDate && staffScheduleForDate.classes['S' + s];
                                                    return (
                                                        <div key={s} className="bg-slate-50 rounded-2xl p-3 border border-slate-100">
                                                            <div className="text-[9px] font-black text-indigo-600 uppercase tracking-widest">Session {s}</div>
                                                            {sched ? (
                                                                <>
                                                                    <div className="text-xs font-bold text-slate-800 mt-1">{sched.activity}</div>
                                                                    {sched.venue && <div className="text-[10px] text-slate-400 font-medium">{sched.venue}</div>}
                                                                </>
                                                            ) : (
                                                                <div className="text-xs text-slate-300 italic mt-1">Free</div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-3">
                                                Duty — {staffScheduleForDate ? staffScheduleForDate.dayKey : ''}
                                            </p>
                                            {staffScheduleForDate && staffScheduleForDate.duty.length > 0 ? (
                                                <div className="space-y-2">
                                                    {staffScheduleForDate.duty.map((entry, di) => (
                                                        <div key={di} className="bg-slate-50 rounded-2xl p-3 border border-slate-100">
                                                            <div className="flex items-center justify-between">
                                                                <span className="text-xs font-bold text-slate-800">{entry.duty}</span>
                                                                <span className="text-[10px] font-black text-indigo-600 uppercase tracking-widest">{entry.time}</span>
                                                            </div>
                                                            <div className="text-[10px] text-slate-400 font-bold uppercase mt-1">{entry.where}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <p className="text-xs text-slate-300 italic">No duty scheduled that day</p>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                    <div className="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-slate-50 to-transparent pointer-events-none"></div>
                    <div className="fixed bottom-4 right-4 z-50 pointer-events-auto">
                        <button onClick={logout} className="bg-white/80 backdrop-blur-md p-3 rounded-full shadow-lg border border-slate-200 text-rose-500 hover:bg-rose-50 transition-colors">
                            <Icon name="log-out" size={18} />
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
