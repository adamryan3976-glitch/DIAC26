    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLa9VEQWwPR_yTU50r09f-X_PHMyOxFV4cOqyuZvLOuu861OiTfwrsp8a6Z6RnYOre/exec";
        const APP_LOGO_URL = "https://raw.githubusercontent.com/adamryan3976-glitch/DIAC26/main/diaclogo.png";
        const PAGE_SIZE = 100;
        const GOOGLE_CLIENT_ID = "241712157669-1huukafbcpsifc4v35op6o80qjb10r0r.apps.googleusercontent.com";
        const TAB_LABELS = { students: 'Artists', attendance: 'attendance', hoc: 'hoc', schedule: 'schedule', massage: 'Massage', duty: 'Duty', map: 'Map', housing: 'Housing', staffFinder: 'Find Staff' };

        function normalizeStaffKey(text) {
            return String(text || '').replace(/[\s.]/g, '').toLowerCase();
        }

        function getDayKeyForDate(d) {
            return d.toLocaleDateString('en-US', { weekday: 'long' }) + ' ' + d.getDate();
        }

        // Checks whether a duty entry's "who" list refers to this staff member.
        // Matches on the normalized full name or abbreviation first; falls back to
        // a first-initial + last-name match so small formatting differences in the
        // Supervision sheet (extra space, missing period, etc.) don't hide a match.
        function staffMatchesWho(person, whoList) {
            const whoNormalized = (whoList || []).map(normalizeStaffKey);
            const fullKey = normalizeStaffKey(person.name);
            const abbrevKey = normalizeStaffKey(person.abbrev);
            if (whoNormalized.includes(fullKey) || whoNormalized.includes(abbrevKey)) return true;
            const parts = person.name.trim().split(/\s+/);
            if (parts.length >= 2) {
                const firstInitial = parts[0][0].toLowerCase();
                const lastName = normalizeStaffKey(parts.slice(1).join(' '));
                return whoNormalized.some(w => lastName && w.endsWith(lastName) && w.startsWith(firstInitial));
            }
            return false;
        }

        // Best-effort parse of a duty time range like "4:15 - 5:00" into
        // minutes-since-midnight. Uses an explicit AM/PM word in the duty's own
        // label if present (e.g. "PM 1 free time"), otherwise falls back to
        // assuming 1-6 o'clock means PM (typical for an afternoon/evening camp
        // duty block) since the sheet's time text alone doesn't carry AM/PM.
        function parseDutyTimeRange(timeText, dutyText) {
            const matches = [...String(timeText || '').matchAll(/(\d{1,2}):(\d{2})/g)];
            if (matches.length < 2) return null;
            const marker = /\bpm\b/i.test(dutyText) ? 'PM' : (/\bam\b/i.test(dutyText) ? 'AM' : null);
            const toMinutes = (h, m) => {
                h = parseInt(h, 10);
                if (marker === 'PM' && h < 12) h += 12;
                else if (marker === 'AM' && h === 12) h = 0;
                else if (!marker && h >= 1 && h <= 6) h += 12;
                return h * 60 + parseInt(m, 10);
            };
            return { start: toMinutes(matches[0][1], matches[0][2]), end: toMinutes(matches[1][1], matches[1][2]) };
        }

        // Camp property map, stored as a Google Drive image. The file must be
        // shared as "Anyone with the link" for these direct-view URLs to load
        // without asking staff to sign in to Drive separately.
        const CAMP_MAP_FILE_ID = "1uTp8Q_kTQgnnWPIlo0cqwRUo3nkBEnr9";
        const CAMP_MAP_IMAGE_URL = `https://lh3.googleusercontent.com/d/${CAMP_MAP_FILE_ID}=s1600`;
        const CAMP_MAP_FULLSCREEN_URL = `https://lh3.googleusercontent.com/d/${CAMP_MAP_FILE_ID}=s0`;

        // Period time windows, used to default the Attendance tab to whatever
        // session is currently running. Expressed in minutes-since-midnight,
        // local device time (staff phones are expected to be on camp-local time).
        const PERIOD_TIMES = [
            { session: '1', start: 9 * 60 + 0, end: 10 * 60 + 15 },   // 9:00 - 10:15
            { session: '2', start: 10 * 60 + 30, end: 11 * 60 + 45 }, // 10:30 - 11:45
            { session: '3', start: 13 * 60 + 30, end: 14 * 60 + 45 }, // 1:30 - 2:45 PM
            { session: '4', start: 15 * 60 + 0, end: 16 * 60 + 15 },  // 3:00 - 4:15 PM
        ];

        // Returns the session currently running, or — between/outside periods
        // — the next one coming up today, or the last one if the day's
        // periods are already over.
        function getCurrentPeriod(now) {
            const d = now || new Date();
            const minutes = d.getHours() * 60 + d.getMinutes();
            for (const p of PERIOD_TIMES) {
                if (minutes >= p.start && minutes < p.end) return p.session;
            }
            for (const p of PERIOD_TIMES) {
                if (minutes < p.start) return p.session;
            }
            return PERIOD_TIMES[PERIOD_TIMES.length - 1].session;
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const GoogleIcon = () => (
            <svg width="18" height="18" viewBox="0 0 48 48" className="shrink-0">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
            </svg>
        );

        const getDirectDriveUrl = (url) => {
            if (!url) return null;
            const s = String(url).trim();
            if (s.includes('drive.google.com')) {
                let id = "";
                if (s.includes('id=')) { id = s.split('id=')[1].split('&')[0]; }
                else if (s.includes('/file/d/')) { id = s.split('/file/d/')[1].split('/')[0]; }
                return id ? `https://lh3.googleusercontent.com/d/${id}=s400` : s;
            }
            if (!s.includes('http') && !s.includes('/')) {
                // A bare Drive file ID (e.g. from the Staff Finder photo lookup)
                // rather than a full URL.
                return `https://lh3.googleusercontent.com/d/${s}=s400`;
            }
            return s;
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [isHoc, setIsHoc] = useState(false);
            const [currentUser, setCurrentUser] = useState('');
            const [authError, setAuthError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [tokenClient, setTokenClient] = useState(null);
            const [sessionToken, setSessionToken] = useState('');
            const [fetchError, setFetchError] = useState('');
            const [submitError, setSubmitError] = useState('');

            const [activeTab, setActiveTab] = useState('students');
            const [searchQuery, setSearchQuery] = useState('');
            const [dutySearchQuery, setDutySearchQuery] = useState('');
            const [students, setStudents] = useState([]);
            const [schedule, setSchedule] = useState([]);
            const [absences, setAbsences] = useState([]); 
            const [classes, setClasses] = useState({ S1: [], S2: [], S3: [], S4: [] });
            const [attStudents, setAttStudents] = useState([]);
            const [massageSchedule, setMassageSchedule] = useState([]);
            const [dutyRoster, setDutyRoster] = useState([]);
            const [staffHousing, setStaffHousing] = useState([]);
            const [staffRoster, setStaffRoster] = useState([]);
            const [staffClassSchedule, setStaffClassSchedule] = useState({});
            const [staffPickerQuery, setStaffPickerQuery] = useState('');
            const [selectedStaffIndex, setSelectedStaffIndex] = useState(null);
            const [staffFinderDate, setStaffFinderDate] = useState(() => {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            });

            const [loading, setLoading] = useState(true);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [refreshing, setRefreshing] = useState(false);
            const [lastUpdated, setLastUpdated] = useState(null);

            const [attSession, setAttSession] = useState(() => getCurrentPeriod());
            const [attSessionAuto, setAttSessionAuto] = useState(true); // false once staff manually picks a session
            const [attActivity, setAttActivity] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            
            const [localAttendance, setLocalAttendance] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [hocSyncingId, setHocSyncingId] = useState(null);

            const [hocSession, setHocSession] = useState('1');
            const [hocNotes, setHocNotes] = useState({}); // Stores the active notes typed by HOC

            useEffect(() => {
                const user = localStorage.getItem('diac_user');
                const hoc = localStorage.getItem('diac_hoc');
                const session = localStorage.getItem('diac_session');
                if (user && session) {
                    setIsAuthenticated(true);
                    setCurrentUser(user);
                    setIsHoc(hoc === 'true');
                    setSessionToken(session);
                    fetchData(session);
                } else { setLoading(false); }
            }, []);

            const logout = () => {
                localStorage.removeItem('diac_user');
                localStorage.removeItem('diac_hoc');
                localStorage.removeItem('diac_session');
                window.location.reload();
            };

            // Initialize the Google OAuth client using a full-page redirect
            // rather than a popup. Google's own guidance is to avoid the popup
            // UX mode on mobile: many mobile browsers don't cleanly block a
            // JS-opened popup — instead they silently steer it into an
            // already-open background tab, showing whatever was last loaded
            // there instead of Google's sign-in page. A redirect never opens
            // a second window, so it can't be hijacked that way. Because the
            // page fully reloads after the redirect back, the same callback
            // must be (and is) re-registered on every mount — which this
            // effect already does.
            useEffect(() => {
                if (isAuthenticated) return;
                let cancelled = false;

                const initGis = () => {
                    if (cancelled) return;
                    if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
                        const client = google.accounts.oauth2.initTokenClient({
                            client_id: GOOGLE_CLIENT_ID,
                            scope: 'https://www.googleapis.com/auth/userinfo.email',
                            ux_mode: 'redirect',
                            redirect_uri: window.location.origin + window.location.pathname,
                            callback: handleGoogleSsoCallback
                        });
                        setTokenClient(client);
                    } else {
                        setTimeout(initGis, 300);
                    }
                };
                initGis();

                return () => { cancelled = true; };
            }, [isAuthenticated]);

            const handleGoogleSsoCallback = async (response) => {
                // The redirect flow returns the token in the URL fragment;
                // clear it immediately so it's never left sitting around in
                // browser history.
                if (window.location.hash) {
                    window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
                }
                if (!response || response.error) {
                    setIsLoggingIn(false);
                    if (response && response.error !== 'popup_closed' && response.error !== 'popup_closed_by_user') {
                        setAuthError('Google sign-in failed. Please try again.');
                    }
                    return;
                }
                setIsLoggingIn(true);
                setAuthError('');
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=login&token=${encodeURIComponent(response.access_token)}`);
                    const data = await res.json();

                    if (data.success) {
                        localStorage.setItem('diac_user', data.email);
                        localStorage.setItem('diac_hoc', String(data.isHoc));
                        localStorage.setItem('diac_session', data.session);
                        setIsAuthenticated(true);
                        setCurrentUser(data.email);
                        setIsHoc(data.isHoc);
                        setSessionToken(data.session);
                        fetchData(data.session);
                    } else {
                        setAuthError(data.error || "Login Failed");
                    }
                } catch (e) {
                    setAuthError("Connection Error");
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleSignInClick = () => {
                if (!tokenClient) return;
                setAuthError('');
                setIsLoggingIn(true);
                tokenClient.requestAccessToken({ prompt: '' });
            };

            const fetchData = async (tokenOverride) => {
                const token = tokenOverride || sessionToken;
                if (!token) return;
                setRefreshing(true);
                setFetchError('');
                try {
                    const endpoints = ['students', 'schedule', 'absences', 'classes', 'attStudents', 'massageSchedule', 'duty', 'housing', 'staffFinder'];
                    const results = await Promise.all(
                        endpoints.map(ep =>
                            fetch(`${SCRIPT_URL}?action=${ep}&session=${encodeURIComponent(token)}`)
                                .then(r => r.json())
                                .catch(() => ({ error: 'network' }))
                        )
                    );

                    if (results.some(r => r && typeof r.error === 'string' && r.error.startsWith('Unauthorized'))) {
                        setFetchError('Your session expired. Please sign in again.');
                        logout();
                        return;
                    }

                    const failedEndpoints = endpoints.filter((ep, i) => !results[i] || results[i].error);
                    const failed = failedEndpoints.length > 0;
                    if (failed) {
                        setFetchError(`Could not refresh: ${failedEndpoints.join(', ')}. Showing the last version loaded — check your connection and try again.`);
                    }

                    if (results[0] && !results[0].error) setStudents(results[0]);
                    if (results[1] && !results[1].error) setSchedule(results[1]);
                    if (results[2] && !results[2].error) {
                        setAbsences(results[2]);
                        const initialLocal = {};
                        const today = new Date().toDateString();
                        results[2].forEach(abs => {
                            const absDate = new Date(abs.timestamp).toDateString();
                            if (absDate === today) {
                                initialLocal[`${abs.studentName}-${abs.session}-${abs.activity}`] = abs.status;
                            }
                        });
                        setLocalAttendance(prev => ({...prev, ...initialLocal}));
                    }
                    if (results[3] && !results[3].error) setClasses(results[3]);
                    if (results[4] && !results[4].error) setAttStudents(results[4]);
                    if (results[5] && !results[5].error) setMassageSchedule(results[5]);
                    if (results[6] && !results[6].error) setDutyRoster(results[6]);
                    if (results[7] && !results[7].error) setStaffHousing(results[7]);
                    if (results[8] && !results[8].error) {
                        setStaffRoster(Array.isArray(results[8].roster) ? results[8].roster : []);
                        setStaffClassSchedule(results[8].classSchedule || {});
                    }

                    if (!failed) {
                        setLastUpdated(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                    }
                } catch (e) {
                    setFetchError('Could not refresh data — showing the last version loaded. Check your connection and try again.');
                }
                finally { setLoading(false); setRefreshing(false); setHocSyncingId(null); }
            };

            // Re-sync the Attendance tab to whichever period is running right
            // now each time staff open that tab — but only while they haven't
            // manually picked a different session, so it never fights a
            // deliberate choice.
            useEffect(() => {
                if (activeTab === 'attendance' && attSessionAuto) {
                    setAttSession(getCurrentPeriod());
                }
            }, [activeTab]);

            // Auto-refresh while an HOC is viewing the HOC tab, so if two HOCs
            // are both out looking for the same student, whichever one finds
            // them first shows up for the other within a few seconds instead
            // of requiring a manual pull-to-refresh.
            useEffect(() => {
                if (!isAuthenticated || !isHoc || activeTab !== 'hoc') return;
                const interval = setInterval(() => { fetchData(); }, 20000);
                return () => clearInterval(interval);
            }, [isAuthenticated, isHoc, activeTab, sessionToken]);

            const stageStatusChange = (studentName, newStatus) => {
                const key = `${studentName}-${attSession}-${attActivity}`;
                setLocalAttendance(prev => ({ ...prev, [key]: newStatus }));
            };

            // Every enrolled student defaults to "Present" until the teacher
            // flags an exception — this both matches how attendance is
            // normally taken (call out exceptions, not every present kid)
            // and, critically, means SUBMIT always records the full class
            // roster (not just the students someone tapped). That full-roster
            // record on every submission is what lets the HOC tab tell "this
            // class hasn't done attendance at all" apart from "this class did
            // attendance and everyone was present" — both used to look
            // identical (zero rows) before this change.
            const DEFAULT_STATUS = 'Present';

            const handleNoteChange = (id, text) => {
                setHocNotes(prev => ({ ...prev, [id]: text }));
            };

            const handleHocUpdate = async (studentName, currentAbsence, newStatus, noteText) => {
                setHocSyncingId(currentAbsence.id);
                setFetchError('');
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            action: 'updateAbsence',
                            session: sessionToken,
                            id: currentAbsence.id,
                            status: newStatus,
                            note: noteText || ''
                        })
                    });
                    const data = await res.json();
                    if (!data || data.success !== true) {
                        setFetchError((data && data.error) || 'Could not save that update. Please try again.');
                        setHocSyncingId(null);
                        return;
                    }
                    const key = `${studentName}-${currentAbsence.session}-${currentAbsence.activity}`;
                    setLocalAttendance(prev => ({...prev, [key]: newStatus}));
                    await fetchData();
                } catch (e) {
                    setFetchError('Could not save that update — check your connection and try again.');
                    setHocSyncingId(null);
                }
            };

            const handleSubmitAttendance = async () => {
                setIsSubmitting(true);
                setSubmitError('');
                const updates = [];
                const today = new Date().toDateString();
                
                enrolledInCurrent.forEach(s => {
                    const name = s.displayName;
                    const key = `${name}-${attSession}-${attActivity}`;
                    const status = localAttendance[key] || DEFAULT_STATUS;

                    const existing = absences.find(a => {
                        const absDate = new Date(a.timestamp).toDateString();
                        return a.studentName === name &&
                               String(a.session) === String(attSession) &&
                               a.activity === attActivity &&
                               absDate === today;
                    });

                    // Only include a student when there's no record for them
                    // yet (first-time submission for the class — this is what
                    // establishes "this class has done attendance" even when
                    // everyone's present) or their status has actually
                    // changed since what we last saw from the server. An
                    // untouched student is never resent, so a teacher fixing
                    // one student's status later can't accidentally overwrite
                    // an HOC's update to a different student with stale data.
                    if (!existing || existing.status !== status) {
                        const studentData = students.find(st => st.preferredName === name);
                        updates.push({
                            id: existing ? existing.id : null,
                            studentId: studentData ? studentData.stuNum : '000',
                            studentName: name,
                            cabin: studentData ? studentData.cabin : 'Unknown',
                            session: attSession,
                            activity: attActivity,
                            status: status,
                            reportedBy: currentUser
                        });
                    }
                });

                if (updates.length === 0) {
                    setIsSubmitting(false);
                    return;
                }

                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            action: 'bulkReport',
                            session: sessionToken,
                            data: JSON.stringify(updates)
                        })
                    });
                    const data = await res.json();
                    if (!data || data.success !== true) {
                        setSubmitError((data && data.error) || 'Could not save attendance. Please try again.');
                        setIsSubmitting(false);
                        return;
                    }
                    await fetchData();
                } catch (e) {
                    setSubmitError('Could not save attendance — check your connection and try again.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const sortedArtists = useMemo(() => {
                if (!Array.isArray(students)) return [];
                return [...students].sort((a, b) => {
                    const lastA = String(a.lastName || "").toLowerCase();
                    const lastB = String(b.lastName || "").toLowerCase();
                    if (lastA !== lastB) return lastA.localeCompare(lastB);
                    return String(a.firstName || "").toLowerCase().localeCompare(String(b.firstName || "").toLowerCase());
                });
            }, [students]);

            const filteredStudents = useMemo(() => {
                const query = searchQuery.toLowerCase().trim();
                return sortedArtists.filter(s => 
                    String(s.preferredName || "").toLowerCase().includes(query) || 
                    String(s.firstName || "").toLowerCase().includes(query) || 
                    String(s.lastName || "").toLowerCase().includes(query)
                );
            }, [sortedArtists, searchQuery]);

            const totalPages = Math.max(1, Math.ceil(filteredStudents.length / PAGE_SIZE));
            const pagedStudents = useMemo(() => {
                const start = (currentPage - 1) * PAGE_SIZE;
                return filteredStudents.slice(start, start + PAGE_SIZE);
            }, [filteredStudents, currentPage]);

            const enrolledInCurrent = useMemo(() => {
                if (!attActivity || !Array.isArray(attStudents)) return [];
                const sessKey = `S${attSession}`;
                return attStudents.filter(s => s[sessKey] === attActivity);
            }, [attStudents, attActivity, attSession]);

            const hasUnsavedChanges = useMemo(() => {
                const today = new Date().toDateString();
                return enrolledInCurrent.some(s => {
                    const name = s.displayName;
                    const key = `${name}-${attSession}-${attActivity}`;
                    const localStatus = localAttendance[key] || DEFAULT_STATUS;
                    const serverAbsence = absences.find(a => 
                        a.studentName === name && 
                        String(a.session) === String(attSession) && 
                        a.activity === attActivity &&
                        new Date(a.timestamp).toDateString() === today
                    );
                    const serverStatus = serverAbsence ? serverAbsence.status : 'Not Completed';
                    return localStatus !== serverStatus;
                });
            }, [enrolledInCurrent, localAttendance, absences, attSession, attActivity]);

            const groupedMassage = useMemo(() => {
                if (!Array.isArray(massageSchedule)) return [];
                const groups = [];
                const byDay = {};
                massageSchedule.forEach(entry => {
                    const dayKey = entry.day || 'Unscheduled';
                    if (!byDay[dayKey]) {
                        byDay[dayKey] = { day: dayKey, entries: [] };
                        groups.push(byDay[dayKey]);
                    }
                    byDay[dayKey].entries.push(entry);
                });
                return groups;
            }, [massageSchedule]);

            const groupedDuty = useMemo(() => {
                if (!Array.isArray(dutyRoster)) return [];
                const query = dutySearchQuery.toLowerCase().trim();
                const filtered = query
                    ? dutyRoster.filter(entry => {
                        const whoText = Array.isArray(entry.who) ? entry.who.join(', ') : String(entry.who || '');
                        return whoText.toLowerCase().includes(query);
                    })
                    : dutyRoster;
                const groups = [];
                const byDay = {};
                filtered.forEach(entry => {
                    const dayKey = entry.day || 'Unscheduled';
                    if (!byDay[dayKey]) {
                        byDay[dayKey] = { day: dayKey, entries: [] };
                        groups.push(byDay[dayKey]);
                    }
                    byDay[dayKey].entries.push(entry);
                });
                return groups;
            }, [dutyRoster, dutySearchQuery]);

            const groupedHousing = useMemo(() => {
                if (!Array.isArray(staffHousing)) return [];
                const groups = [];
                const byLocation = {};
                staffHousing.forEach(entry => {
                    const locKey = entry.location || 'Unassigned';
                    if (!byLocation[locKey]) {
                        byLocation[locKey] = { location: locKey, rooms: [] };
                        groups.push(byLocation[locKey]);
                    }
                    byLocation[locKey].rooms.push(entry);
                });
                return groups;
            }, [staffHousing]);

            const filteredStaffRoster = useMemo(() => {
                const sorted = [...staffRoster].sort((a, b) => a.name.localeCompare(b.name));
                const query = staffPickerQuery.toLowerCase().trim();
                if (!query) return sorted;
                return sorted.filter(p => p.name.toLowerCase().includes(query));
            }, [staffRoster, staffPickerQuery]);

            const selectedStaffPerson = selectedStaffIndex !== null ? staffRoster[selectedStaffIndex] : null;

            const whereAreTheyNow = useMemo(() => {
                if (!selectedStaffPerson) return null;
                const now = new Date();
                const nowMinutes = now.getHours() * 60 + now.getMinutes();
                const dayKey = getDayKeyForDate(now);

                const todaysDuty = (Array.isArray(dutyRoster) ? dutyRoster : [])
                    .filter(e => e.day === dayKey && staffMatchesWho(selectedStaffPerson, e.who));
                for (const entry of todaysDuty) {
                    const range = parseDutyTimeRange(entry.time, entry.duty);
                    if (range && nowMinutes >= range.start && nowMinutes <= range.end) {
                        return { type: 'duty', label: entry.duty, where: entry.where, time: entry.time };
                    }
                }

                const period = getCurrentPeriod(now);
                const sched = (staffClassSchedule[selectedStaffPerson.abbrev] || {})['S' + period];
                if (sched) return { type: 'class', label: sched.activity, where: sched.venue, session: period };
                return { type: 'free', session: period };
            }, [selectedStaffPerson, dutyRoster, staffClassSchedule]);

            const staffScheduleForDate = useMemo(() => {
                if (!selectedStaffPerson || !staffFinderDate) return null;
                const d = new Date(staffFinderDate + 'T00:00:00');
                const dayKey = getDayKeyForDate(d);
                const dutyForDay = (Array.isArray(dutyRoster) ? dutyRoster : [])
                    .filter(e => e.day === dayKey && staffMatchesWho(selectedStaffPerson, e.who));
                const classSched = staffClassSchedule[selectedStaffPerson.abbrev] || {};
                return { dayKey, duty: dutyForDay, classes: classSched };
            }, [selectedStaffPerson, staffFinderDate, dutyRoster, staffClassSchedule]);

            const DetailRow = ({ label, value, icon }) => (
                <div className="flex items-start gap-4 p-4 bg-white/70 backdrop-blur-sm rounded-2xl border border-white shadow-sm">
                    <div className="p-2 bg-indigo-50 text-indigo-600 rounded-xl shrink-0"><Icon name={icon} size={18} /></div>
                    <div>
                        <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{label}</div>
                        <div className="text-sm font-bold text-slate-900">{value || 'N/A'}</div>
                    </div>
                </div>
            );

            const Pagination = ({ pos }) => (
                <div className={`flex items-center justify-between bg-white px-4 py-3 rounded-2xl border border-slate-200 shadow-sm ${pos === 'top' ? 'mb-4' : 'mt-4'}`}>
                    <button disabled={currentPage === 1} onClick={() => {setCurrentPage(p => p - 1); window.scrollTo(0,0);}} className="p-2 disabled:opacity-20 text-indigo-600"><Icon name="chevron-left" /></button>
                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Page {currentPage} / {totalPages}</span>
                    <button disabled={currentPage >= totalPages} onClick={() => {setCurrentPage(p => p + 1); window.scrollTo(0,0);}} className="p-2 disabled:opacity-20 text-indigo-600"><Icon name="chevron-right" /></button>
                </div>
            );

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white gap-4">
                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                    <p className="whimsical-font text-slate-400 font-bold uppercase text-[10px] tracking-widest">DIAC HUB LOADING...</p>
                </div>
            );

            if (!isAuthenticated) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-transparent relative z-10">
                    <div className="w-full max-w-sm space-y-6 animate-fade-in bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-white/50">
                        <div className="text-center">
                            <img src={APP_LOGO_URL} className="w-20 mx-auto mb-4" />
                            <h1 className="text-3xl font-black text-indigo-600 whimsical-font italic uppercase text-center">DIAC HUB</h1>
                        </div>
                        <div className="space-y-4 pt-4">
                            <p className="text-xs text-slate-500 font-medium text-center">
                                Secure single sign-on access. Please use your official school board Google credentials to verify.
                            </p>
                            <div className="pt-2">
                                <button
                                    onClick={handleSignInClick}
                                    disabled={!tokenClient || isLoggingIn}
                                    className="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 hover:bg-slate-50 disabled:opacity-50 text-slate-700 font-bold text-sm py-3.5 rounded-2xl shadow-sm transition-colors"
                                >
                                    <GoogleIcon />
                                    {isLoggingIn ? 'Verifying credentials...' : 'Sign in with Google'}
                                </button>
                            </div>
                            {authError && <p className="text-rose-500 text-xs font-bold text-center px-2">{authError}</p>}
                        </div>
                    </div>
                </div>
            );

            // Filter for HOC Tab: Only show if NOT present. Sorted so
            // still-unlocated students ("Absent") surface above ones already
            // found and marked Late/Excused, so HOCs see who still needs
            // locating first.
            const HOC_STATUS_PRIORITY = { 'Absent - Unknown': 0, 'Late': 1, 'Absent - Excused': 2 };
            const activeHocAbsences = absences
                .filter(a =>
                    String(a.session) === String(hocSession) &&
                    new Date(a.timestamp).toDateString() === new Date().toDateString() &&
                    a.status !== 'Present'
                )
                .sort((a, b) => (HOC_STATUS_PRIORITY[a.status] ?? 99) - (HOC_STATUS_PRIORITY[b.status] ?? 99));

            // Classes that have submitted NO attendance records at all for
            // this session today (including all-present submissions, which
            // now always write a full-roster record — see DEFAULT_STATUS
            // above), so HOCs can chase down whichever teacher hasn't done
            // attendance yet.
            const submittedActivitiesThisSession = new Set(
                absences
                    .filter(a => String(a.session) === String(hocSession) && new Date(a.timestamp).toDateString() === new Date().toDateString())
                    .map(a => a.activity)
            );
            const missingAttendanceClasses = (classes[`S${hocSession}`] || [])
                .filter(c => !submittedActivitiesThisSession.has(c));

            // Filter for Recent Reports block
            const recentReportsList = [...absences]
                .filter(a => a.status !== 'Present')
                .reverse()
                .slice(0, 10);

            if (selectedStudent) return (
                <div className="min-h-screen bg-transparent animate-fade-in pb-12">
                    <header className="bg-slate-900/90 backdrop-blur-md text-white p-5 sticky top-0 z-50 flex items-center gap-4">
                        <button onClick={() => setSelectedStudent(null)} className="p-2"><Icon name="arrow-left" /></button>
                        <h1 className="text-lg font-bold truncate whimsical-font">{selectedStudent.preferredName}</h1>
                    </header>
                    <div className="p-4 max-w-2xl mx-auto space-y-4">
                        <div className="bg-white/80 backdrop-blur-md p-6 rounded-[2.5rem] shadow-sm border border-white text-center">
                            <div className="w-28 h-28 rounded-[2rem] overflow-hidden shadow-inner mx-auto bg-slate-100 flex items-center justify-center border-4 border-white mb-4">
                                {selectedStudent.photo ? <img src={getDirectDriveUrl(selectedStudent.photo)} className="w-full h-full object-cover" /> : <Icon name="user" size={40} className="text-slate-300" />}
                            </div>
                            <h2 className="text-2xl font-black text-slate-800 leading-tight">{selectedStudent.preferredName}</h2>
                            <div className="flex flex-wrap justify-center gap-2 mt-3">
                                <span className="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-[10px] font-black uppercase">{selectedStudent.pronouns}</span>
                                <span className="px-3 py-1 bg-slate-900 text-white rounded-full text-[10px] font-black uppercase">{selectedStudent.cabin}</span>
                                <span className="px-3 py-1 bg-slate-100 text-slate-500 rounded-full text-[10px] font-black uppercase">{selectedStudent.grade}</span>
                            </div>
                        </div>
                        <div className="grid gap-3">
                            <DetailRow label="School" value={selectedStudent.school} icon="school" />
                            <DetailRow label="Birth Date" value={selectedStudent.birthDate} icon="calendar" />
                            <DetailRow label="Dietary Restrictions" value={selectedStudent.dietary} icon="utensils" />
                            <DetailRow label="Allergies" value={selectedStudent.allergies} icon="alert-circle" />
                            <div className="px-4 py-2 text-[10px] font-black text-slate-400 uppercase tracking-widest mt-2">Guardian Contact</div>
                            <DetailRow label="Guardian" value={`${selectedStudent.guardianFirstName} ${selectedStudent.guardianLastName}`} icon="users" />
                            <DetailRow label="Phone" value={selectedStudent.guardianPhone} icon="phone" />
                            <DetailRow label="Guardian Email" value={selectedStudent.guardianEmail} icon="mail" />
                            <DetailRow label="Preferred Email" value={selectedStudent.preferredEmail} icon="at-sign" />
                            <div className="px-4 py-2 text-[10px] font-black text-slate-400 uppercase tracking-widest mt-2">Activity Schedule</div>
                            <DetailRow label="Session 1" value={`${selectedStudent.s1Activity} @ ${selectedStudent.s1Venue}`} icon="star" />
                            <DetailRow label="Session 2" value={`${selectedStudent.s2Activity} @ ${selectedStudent.s2Venue}`} icon="star" />
                            <DetailRow label="Session 3" value={`${selectedStudent.s3Activity} @ ${selectedStudent.s3Venue}`} icon="star" />
                            <DetailRow label="Session 4" value={`${selectedStudent.s4Activity} @ ${selectedStudent.s4Venue}`} icon="star" />
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-transparent pb-24">
                    <header className="bg-slate-900/90 backdrop-blur-md text-white p-5 sticky top-0 z-50 flex justify-between items-center">
                        <h1 className="text-xl font-black whimsical-font italic tracking-tighter">DIAC HUB</h1>
                        <button onClick={fetchData} className={`p-2 bg-slate-800 rounded-xl ${refreshing ? 'animate-spin' : ''}`}><Icon name="refresh-cw" size={18}/></button>
                    </header>

                    <main className="p-4 max-w-xl mx-auto space-y-4">
                        {fetchError && (
                            <div className="bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold p-3 rounded-2xl flex items-center gap-2 animate-fade-in">
                                <Icon name="alert-triangle" size={16} />
                                <span>{fetchError}</span>
                            </div>
                        )}
                        {lastUpdated && !fetchError && (
                            <div className="text-center text-[9px] font-bold text-slate-400 uppercase tracking-widest">Updated {lastUpdated}</div>
                        )}
                        <nav className="grid grid-cols-4 gap-1 bg-white/70 backdrop-blur-md p-1 rounded-2xl shadow-sm border border-white">
                            {['students', 'attendance', 'hoc', 'schedule', 'massage', 'duty', 'map', 'housing', 'staffFinder'].map(tab => (
                                (tab !== 'hoc' || isHoc) &&
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`py-3 px-1 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${activeTab === tab ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400'}`}>
                                    {TAB_LABELS[tab] || tab}
                                </button>
                            ))}
                        </nav>

                        {activeTab === 'students' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="relative">
                                    <Icon name="search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" />
                                    <input type="text" placeholder="Search Artists..." className="w-full bg-white/70 backdrop-blur-sm border border-white p-4 pl-12 rounded-3xl shadow-sm outline-none font-medium text-sm" value={searchQuery} onChange={e => {setSearchQuery(e.target.value); setCurrentPage(1);}} />
                                </div>
                                <Pagination pos="top" />
                                <div className="grid gap-2">
                                    {pagedStudents.map((s, idx) => (
                                        <button key={idx} onClick={() => setSelectedStudent(s)} className="bg-white/60 backdrop-blur-sm p-4 rounded-2xl border border-white flex items-center justify-between w-full shadow-sm text-left">
                                            <div className="flex items-center gap-4">
                                                <div className="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center border border-slate-100 overflow-hidden shadow-sm">
                                                    {s.photo ? <img src={getDirectDriveUrl(s.photo)} className="w-full h-full object-cover" /> : <Icon name="user" className="text-slate-200" size={20} />}
                                                </div>
                                                <div>
                                                    <div className="font-bold text-slate-900 text-sm leading-tight">{s.preferredName}</div>
                                                    <div className="text-[9px] text-slate-400 font-bold uppercase mt-0.5">{s.cabin}</div>
                                                </div>
                                            </div>
                                            <Icon name="chevron-right" size={16} className="text-slate-200" />
                                        </button>
                                    ))}
                                </div>
                                <Pagination pos="bottom" />
                            </div>
                        )}

                        {activeTab === 'attendance' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white/70 backdrop-blur-md p-6 rounded-[2rem] border border-white shadow-sm space-y-4">
                                    <div className="flex gap-2">
                                        {[1, 2, 3, 4].map(num => (
                                            <button key={num} onClick={() => {setAttSession(num.toString()); setAttActivity(''); setAttSessionAuto(false);}} className={`flex-1 py-3 rounded-xl text-[10px] font-black border transition-all ${attSession === num.toString() ? 'bg-indigo-600 border-indigo-600 text-white shadow-md' : 'bg-slate-50 border-slate-100 text-slate-400'}`}>S{num}</button>
                                        ))}
                                    </div>
                                    <div className="relative">
                                        <select className="w-full bg-white border border-slate-100 p-4 rounded-2xl text-sm outline-none font-bold text-slate-600" value={attActivity} onChange={e => setAttActivity(e.target.value)}>
                                            <option value="">Choose Activity</option>
                                            {(classes[`S${attSession}`] || []).map((c, i) => <option key={i} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                </div>

                                {attActivity && (
                                    <div className="space-y-4">
                                        <button 
                                            disabled={isSubmitting || !hasUnsavedChanges}
                                            onClick={handleSubmitAttendance}
                                            className={`w-full font-black py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 sticky top-24 z-40 animate-fade-in ${hasUnsavedChanges ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-400 opacity-50'}`}
                                        >
                                            <Icon name={isSubmitting ? "loader" : "save"} className={isSubmitting ? "animate-spin" : ""} />
                                            {isSubmitting ? 'SYNCING...' : 'SUBMIT ATTENDANCE'}
                                        </button>
                                        {submitError && (
                                            <div className="bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold p-3 rounded-2xl flex items-center gap-2 animate-fade-in">
                                                <Icon name="alert-triangle" size={16} />
                                                <span>{submitError}</span>
                                            </div>
                                        )}

                                        <div className="space-y-3">
                                            {enrolledInCurrent.map((s, i) => {
                                                const name = s.displayName;
                                                const key = `${name}-${attSession}-${attActivity}`;
                                                const currentStatus = localAttendance[key] || DEFAULT_STATUS;

                                                const today = new Date().toDateString();
                                                const serverAbsence = absences.find(a =>
                                                    a.studentName === name &&
                                                    String(a.session) === String(attSession) &&
                                                    a.activity === attActivity &&
                                                    new Date(a.timestamp).toDateString() === today
                                                );
                                                const serverStatus = serverAbsence ? serverAbsence.status : 'Not Completed';
                                                const isSyncing = isSubmitting && currentStatus !== serverStatus;

                                                const options = [
                                                    { label: 'Present', val: 'Present', color: 'bg-emerald-500 text-white border-emerald-500' },
                                                    { label: 'Absent', val: 'Absent - Unknown', color: 'bg-rose-500 text-white border-rose-500' },
                                                    { label: 'Excused', val: 'Absent - Excused', color: 'bg-amber-500 text-white border-amber-500' },
                                                    { label: 'Late', val: 'Late', color: 'bg-indigo-500 text-white border-indigo-500' }
                                                ];

                                                return (
                                                    <div key={i} className={`bg-white/80 backdrop-blur-sm p-4 rounded-3xl border shadow-sm transition-all ${currentStatus !== 'Present' ? 'border-amber-200' : 'border-slate-100'}`}>
                                                        <div className="font-bold text-slate-800 text-sm mb-3 px-1">{name}</div>
                                                        <div className="grid grid-cols-4 gap-1.5">
                                                            {isSyncing ? (
                                                                <div className="col-span-4 py-3 rounded-xl text-[10px] font-black uppercase text-center bg-slate-50 text-slate-400 animate-pulse">Syncing...</div>
                                                            ) : (
                                                                options.map(opt => (
                                                                    <button
                                                                        key={opt.val}
                                                                        onClick={() => stageStatusChange(name, currentStatus === opt.val ? DEFAULT_STATUS : opt.val)}
                                                                        className={`py-2.5 rounded-xl text-[9px] font-black uppercase border transition-all ${currentStatus === opt.val ? opt.color : 'bg-slate-50 border-slate-100 text-slate-400'}`}
                                                                    >
                                                                        {opt.label}
                                                                    </button>
                                                                ))
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'hoc' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white/70 backdrop-blur-md p-6 rounded-[2rem] border border-white shadow-sm">
                                    <h2 className="text-xl font-black text-slate-800 mb-4 whimsical-font italic">HOC Review</h2>
                                    <div className="flex gap-2 mb-2 overflow-x-auto no-scrollbar">
                                        {[1, 2, 3, 4].map(num => (
                                            <button key={num} onClick={() => setHocSession(num.toString())} className={`flex-1 min-w-[60px] py-2 rounded-xl text-[10px] font-black border transition-all ${hocSession === num.toString() ? 'bg-indigo-600 border-indigo-600 text-white shadow-md' : 'bg-slate-50 border-slate-100 text-slate-400'}`}>S{num}</button>
                                        ))}
                                    </div>
                                </div>

                                {missingAttendanceClasses.length > 0 && (
                                    <div className="bg-amber-50 border border-amber-200 rounded-[2rem] p-5 animate-fade-in">
                                        <div className="flex items-center gap-2 mb-2">
                                            <Icon name="alert-triangle" size={16} className="text-amber-600" />
                                            <h3 className="text-xs font-black text-amber-700 uppercase tracking-widest">Attendance Not Yet Submitted — S{hocSession}</h3>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {missingAttendanceClasses.map((c, i) => (
                                                <span key={i} className="px-3 py-1.5 bg-white/80 text-amber-700 rounded-full text-xs font-bold border border-amber-200">{c}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {activeHocAbsences.map((a, i) => {
                                        // Retrieve note safely handling multiple possible casing keys
                                        const currentNote = hocNotes[a.id] !== undefined ? hocNotes[a.id] : (a.note || a.Note || a.Notes || a.notes || "");
                                        const badgeClass = a.status === 'Absent - Excused' ? 'bg-amber-50 text-amber-600'
                                            : a.status === 'Late' ? 'bg-indigo-50 text-indigo-600'
                                            : 'bg-rose-50 text-rose-600';

                                        return (
                                            <div key={a.id || i} className="bg-white/80 backdrop-blur-sm p-4 rounded-3xl shadow-sm border border-slate-100">
                                                <div className="flex justify-between items-start mb-3">
                                                    <div>
                                                        <div className="font-bold text-slate-800">{a.studentName}</div>
                                                        <div className="text-[9px] text-slate-400 font-bold uppercase mt-1">{a.cabin} • {a.activity}</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className={`text-[9px] font-black px-2 py-1 rounded-lg uppercase ${badgeClass}`}>{a.status}</div>
                                                        <div className="text-[8px] text-slate-400 mt-1 uppercase">Rep: {a.reportedBy}</div>
                                                    </div>
                                                </div>

                                                {/* Added Note Input Field */}
                                                <div className="mb-3">
                                                    <input
                                                        type="text"
                                                        placeholder="Add a note... (e.g. 'At nurse's station')"
                                                        value={currentNote}
                                                        onChange={e => handleNoteChange(a.id, e.target.value)}
                                                        className="w-full text-xs font-medium p-2.5 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:border-indigo-300 text-slate-600 placeholder-slate-400 transition-colors"
                                                    />
                                                </div>

                                                <div className="grid grid-cols-2 gap-2">
                                                    {hocSyncingId === a.id ? (
                                                        <div className="col-span-2 py-2.5 rounded-xl text-[10px] font-black uppercase text-center bg-slate-50 text-slate-400 animate-pulse">Syncing...</div>
                                                    ) : (
                                                        <>
                                                            <button onClick={() => handleHocUpdate(a.studentName, a, 'Late', currentNote)} className={`py-2.5 rounded-xl text-[10px] font-black uppercase border transition-all ${a.status === 'Late' ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-100 bg-slate-50 text-indigo-600 hover:bg-indigo-50'}`}>Late</button>
                                                            <button onClick={() => handleHocUpdate(a.studentName, a, 'Absent - Excused', currentNote)} className={`py-2.5 rounded-xl text-[10px] font-black uppercase border transition-all ${a.status === 'Absent - Excused' ? 'bg-amber-500 border-amber-500 text-white' : 'bg-slate-50 border-slate-100 text-amber-600 hover:bg-amber-50'}`}>Excused</button>
                                                        </>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {activeHocAbsences.length === 0 && (
                                        <p className="text-center py-8 text-slate-400 text-xs font-bold italic">No active absences for Session {hocSession} today</p>
                                    )}
                                </div>

                                {/* Recent Reports block logic */}
                                <div className="mt-8">
                                    <h3 className="text-sm font-black text-slate-800 uppercase tracking-widest mb-4 px-2">Recent Absence Reports</h3>
                                    <div className="space-y-3">
                                        {recentReportsList.length > 0 ? recentReportsList.map((a, i) => (
                                            <div key={i} className="flex justify-between items-center p-3 bg-white/70 backdrop-blur-sm rounded-2xl text-xs border border-white shadow-sm">
                                                <div>
                                                    <span className="font-bold text-slate-800">{a.studentName}</span>
                                                    <p className="text-[9px] text-slate-400 font-bold mt-1">Session {a.session} • {a.activity}</p>
                                                    {/* Display the note in Recent Reports if it exists */}
                                                    {(a.note || a.Note || a.notes || a.Notes) && <p className="text-[9px] text-slate-500 italic mt-1 bg-slate-50 px-2 py-1 rounded inline-block">{(a.note || a.Note || a.notes || a.Notes)}</p>}
                                                </div>
                                                <div className="text-[9px] font-black text-rose-500 bg-rose-50 px-2 py-1 rounded-lg uppercase whitespace-nowrap">{a.status}</div>
                                            </div>
                                        )) : (
                                            <p className="text-center py-8 text-slate-400 text-xs font-bold italic">No recent absence reports</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'schedule' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white/70 backdrop-blur-md p-6 rounded-[2rem] border border-white shadow-sm overflow-hidden">
                                    <h2 className="text-xl font-black text-slate-800 mb-4 whimsical-font italic">Daily Master</h2>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left min-w-[400px]">
                                            <thead>
                                                <tr className="border-b border-slate-200">
                                                    <th className="p-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">Time</th>
                                                    <th className="p-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">Activity</th>
                                                    <th className="p-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">Location</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {schedule.map((row, i) => (
                                                    <tr key={i} className="border-b border-slate-50 hover:bg-slate-50/50">
                                                        <td className="p-3 text-xs font-bold text-indigo-600">{row['Time:']}</td>
                                                        <td className="p-3 text-xs font-bold text-slate-700">{row['Activity:']}</td>
                                                        <td className="p-3 text-xs text-slate-500 italic">{row['Location:']}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'massage' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white/70 backdrop-blur-md p-6 rounded-[2rem] border border-white shadow-sm">
                                    <h2 className="text-xl font-black text-slate-800 mb-1 whimsical-font italic">Massage Appointments</h2>
                                    <p className="text-xs text-slate-400 font-medium">On-site massage therapist schedule for the week.</p>
                                </div>

                                {groupedMassage.length > 0 ? groupedMassage.map((group, gi) => (
                                    <div key={gi} className="bg-white/70 backdrop-blur-md rounded-[2rem] border border-white shadow-sm overflow-hidden">
                                        <div className="px-6 py-3 bg-slate-900/90 text-white">
                                            <h3 className="text-xs font-black uppercase tracking-widest">{group.day}</h3>
                                        </div>
                                        <div className="divide-y divide-slate-100">
                                            {group.entries.map((entry, ei) => (
                                                <div key={ei} className="flex items-center justify-between px-6 py-3">
                                                    <span className="text-sm font-bold text-slate-800">{entry.name || 'Open slot'}</span>
                                                    <span className="text-[10px] font-black text-indigo-600 uppercase tracking-widest">{entry.time}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )) : (
                                    <p className="text-center py-8 text-slate-400 text-xs font-bold italic">No massage appointments scheduled</p>
                                )}
                            </div>
                        )}

                        {activeTab === 'duty' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white/70 backdrop-blur-md p-6 rounded-[2rem] border border-white shadow-sm">
                                    <h2 className="text-xl font-black text-slate-800 mb-1 whimsical-font italic">Duty Roster</h2>
                                    <p className="text-xs text-slate-400 font-medium">Luggage truck, night walks, and free-time supervision assignments for the week.</p>
                                </div>

                                <div className="relative">
                                    <Icon name="search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" />
                                    <input type="text" placeholder="Search by name..." className="w-full bg-white/70 backdrop-blur-sm border border-white p-4 pl-12 pr-12 rounded-3xl shadow-sm outline-none font-medium text-sm" value={dutySearchQuery} onChange={e => setDutySearchQuery(e.target.value)} />
                                    {dutySearchQuery && (
                                        <button onClick={() => setDutySearchQuery('')} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300">
                                            <Icon name="x" size={18} />
                                        </button>
                                    )}
                                </div>

                                {groupedDuty.length > 0 ? groupedDuty.map((group, gi) => (
                                    <div key={gi} className="bg-white/70 backdrop-blur-md rounded-[2rem] border border-white shadow-sm overflow-hidden">
                                        <div className="px-6 py-3 bg-slate-900/90 text-white">
                                            <h3 className="text-xs font-black uppercase tracking-widest">{group.day}</h3>
                                        </div>
                                        <div className="divide-y divide-slate-100">
                                            {group.entries.map((entry, ei) => (
                                                <div key={ei} className="px-6 py-3">
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-sm font-bold text-slate-800">{entry.duty}</span>
                                                        <span className="text-[10px] font-black text-indigo-600 uppercase tracking-widest">{entry.time}</span>
                                                    </div>
                                                    <div className="text-[9px] text-slate-400 font-bold uppercase mt-1">{entry.where}</div>
                                                    <div className="text-xs text-slate-600 font-medium mt-1">{Array.isArray(entry.who) ? entry.who.join(', ') : entry.who}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )) : (
                                    <p className="text-center py-8 text-slate-400 text-xs font-bold italic">{dutySearchQuery ? `No duty assignments found for "${dutySearchQuery}"` : 'No duty assignments scheduled'}</p>
                                )}
                            </div>
                        )}

                        {activeTab === 'map' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white/70 backdrop-blur-md p-6 rounded-[2rem] border border-white shadow-sm">
                                    <h2 className="text-xl font-black text-slate-800 mb-1 whimsical-font italic">Camp Map</h2>
                                    <p className="text-xs text-slate-400 font-medium">Tap the map to open it full-screen and zoom in.</p>
                                </div>
                                <a
                                    href={CAMP_MAP_FULLSCREEN_URL}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="block bg-white/70 backdrop-blur-md rounded-[2rem] border border-white shadow-sm overflow-hidden"
                                >
                                    <img
                                        src={CAMP_MAP_IMAGE_URL}
                                        alt="Camp property map"
                                        className="w-full h-auto block"
                                    />
                                </a>
                                <a
                                    href={CAMP_MAP_FULLSCREEN_URL}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="w-full flex items-center justify-center gap-2 bg-indigo-600 text-white font-black text-xs uppercase tracking-widest py-3.5 rounded-2xl shadow-sm"
                                >
                                    <Icon name="maximize-2" size={16} />
                                    Open Full-Screen
                                </a>
                            </div>
                        )}

                        {activeTab === 'housing' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white/70 backdrop-blur-md p-6 rounded-[2rem] border border-white shadow-sm">
                                    <h2 className="text-xl font-black text-slate-800 mb-1 whimsical-font italic">Staff Housing</h2>
                                    <p className="text-xs text-slate-400 font-medium">Cabin and room assignments for staff this week.</p>
                                </div>

                                {groupedHousing.length > 0 ? groupedHousing.map((group, gi) => (
                                    <div key={gi} className="bg-white/70 backdrop-blur-md rounded-[2rem] border border-white shadow-sm overflow-hidden">
                                        <div className="px-6 py-3 bg-slate-900/90 text-white flex items-center gap-2">
                                            <Icon name="home" size={14} />
                                            <h3 className="text-xs font-black uppercase tracking-widest">{group.location}</h3>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left min-w-[320px]">
                                                <thead>
                                                    <tr className="border-b border-slate-100">
                                                        <th className="p-3 text-[10px] font-black text-slate-400 uppercase tracking-widest w-24">Room</th>
                                                        <th className="p-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">Staff</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {group.rooms.map((r, ri) => (
                                                        <tr key={ri} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/50">
                                                            <td className="p-3 text-xs font-bold text-indigo-600 align-top whitespace-nowrap">{r.room}</td>
                                                            <td className="p-3 text-xs text-slate-700 font-medium">
                                                                {r.staff.length > 0 ? r.staff.join(', ') : <span className="text-slate-300 italic">Unassigned</span>}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )) : (
                                    <p className="text-center py-8 text-slate-400 text-xs font-bold italic">No housing assignments available</p>
                                )}
                            </div>
                        )}

                        {activeTab === 'staffFinder' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-white/70 backdrop-blur-md p-6 rounded-[2rem] border border-white shadow-sm">
                                    <h2 className="text-xl font-black text-slate-800 mb-1 whimsical-font italic">Staff Finder</h2>
                                    <p className="text-xs text-slate-400 font-medium">Pick a staff member to see where they are now and their schedule for any day.</p>
                                </div>

                                <div className="relative">
                                    <Icon name="search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" />
                                    <input
                                        type="text"
                                        placeholder="Search staff by name..."
                                        className="w-full bg-white/70 backdrop-blur-sm border border-white p-4 pl-12 pr-12 rounded-3xl shadow-sm outline-none font-medium text-sm"
                                        value={staffPickerQuery}
                                        onChange={e => { setStaffPickerQuery(e.target.value); setSelectedStaffIndex(null); }}
                                    />
                                    {staffPickerQuery && (
                                        <button onClick={() => setStaffPickerQuery('')} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300">
                                            <Icon name="x" size={18} />
                                        </button>
                                    )}
                                </div>

                                {!selectedStaffPerson && (
                                    <div className="bg-white/70 backdrop-blur-md rounded-[2rem] border border-white shadow-sm overflow-hidden divide-y divide-slate-100 max-h-[420px] overflow-y-auto">
                                        {filteredStaffRoster.length > 0 ? filteredStaffRoster.map((person) => (
                                            <button
                                                key={person.name + person.abbrev}
                                                onClick={() => setSelectedStaffIndex(staffRoster.indexOf(person))}
                                                className="w-full text-left px-6 py-3 flex items-center justify-between hover:bg-slate-50/70"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className="w-9 h-9 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center overflow-hidden shrink-0">
                                                        {person.photoId ? <img src={getDirectDriveUrl(person.photoId)} className="w-full h-full object-cover" /> : <Icon name="user" size={16} className="text-slate-200" />}
                                                    </div>
                                                    <span className="text-sm font-bold text-slate-800">{person.name}</span>
                                                </div>
                                                {person.isHoc && <span className="text-[9px] font-black text-indigo-600 uppercase tracking-widest">HOC</span>}
                                            </button>
                                        )) : (
                                            <p className="text-center py-8 text-slate-400 text-xs font-bold italic">No staff found for "{staffPickerQuery}"</p>
                                        )}
                                    </div>
                                )}

                                {selectedStaffPerson && (
                                    <div className="space-y-4">
                                        <button onClick={() => setSelectedStaffIndex(null)} className="flex items-center gap-1 text-[10px] font-black text-indigo-600 uppercase tracking-widest">
